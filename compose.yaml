name: truthguard

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-TruthGuard}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Set a valid Laravel APP_KEY in Dokploy}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?Set APP_URL in Dokploy}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  PLAYWRIGHT_LOG_LEVEL: ${PLAYWRIGHT_LOG_LEVEL:-warning}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-truthguard}
  DB_USERNAME: ${DB_USERNAME:-truthguard}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-360}
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_SCHEME: ${MAIL_SCHEME:-smtps}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-465}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TruthGuard}
  TRUTHGUARD_ADMIN_EMAILS: ${TRUTHGUARD_ADMIN_EMAILS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
  FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
  FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
  OPENAI_ANALYSIS_ENABLED: ${OPENAI_ANALYSIS_ENABLED:-true}
  OPENAI_CLAIM_EXTRACTION_ENABLED: ${OPENAI_CLAIM_EXTRACTION_ENABLED:-true}
  OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-40}
  OPENAI_MAX_COMPLETION_TOKENS: ${OPENAI_MAX_COMPLETION_TOKENS:-1400}
  OPENAI_IMAGE_CONTEXT_ENABLED: ${OPENAI_IMAGE_CONTEXT_ENABLED:-true}
  OPENAI_IMAGE_MAX_BYTES: ${OPENAI_IMAGE_MAX_BYTES:-4194304}
  OPENAI_SOCIAL_SEARCH_ENABLED: ${OPENAI_SOCIAL_SEARCH_ENABLED:-true}
  OPENAI_SOCIAL_SEARCH_CONTEXT_SIZE: ${OPENAI_SOCIAL_SEARCH_CONTEXT_SIZE:-medium}
  OPENAI_SOCIAL_SEARCH_MAX_RESULTS: ${OPENAI_SOCIAL_SEARCH_MAX_RESULTS:-4}
  OPENAI_SOCIAL_SEARCH_DOMAINS: ${OPENAI_SOCIAL_SEARCH_DOMAINS:-facebook.com,instagram.com,tiktok.com,x.com,twitter.com,youtube.com,reddit.com,threads.net}
  GOOGLE_FACT_CHECK_API_KEY: ${GOOGLE_FACT_CHECK_API_KEY:-}
  PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-true}
  PLAYWRIGHT_AUTOMATION_TOKEN: ${PLAYWRIGHT_AUTOMATION_TOKEN:-}
  DEEPFAKE_MODEL_ENABLED: ${DEEPFAKE_MODEL_ENABLED:-false}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  VIEW_COMPILED_PATH: ${VIEW_COMPILED_PATH:-/var/www/html/bootstrap/cache/views}

x-app: &app
  image: truthguard:${IMAGE_TAG:-local}
  build: .
  environment:
    <<: *app-environment
  restart: unless-stopped
  init: true
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app
    networks:
      - truthguard-internal
      - dokploy-network
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  worker:
    <<: *app
    networks:
      - truthguard-internal
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=300", "--max-time=3600"]
    stop_grace_period: 330s

  scheduler:
    <<: *app
    networks:
      - truthguard-internal
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 330s

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-truthguard}
      MYSQL_USER: ${DB_USERNAME:-truthguard}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    networks:
      - truthguard-internal
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  storage:
  database:

networks:
  truthguard-internal:
    driver: bridge
  dokploy-network:
    external: true
