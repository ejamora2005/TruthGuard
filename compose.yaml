x-app: &app
  image: truthguard:${IMAGE_TAG:-local}
  build: .
  environment:
    <<: *app-environment
  restart: unless-stopped
  init: true
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
    nlp:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nlp:
    image: truthguard-nlp:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: automation/nlp/Dockerfile
    environment:
      TRUTHGUARD_NLP_MODEL_DIR: ${TRUTHGUARD_NLP_MODEL_DIR:-/app/automation/models/filipino-transformer/best_model}
      TRUTHGUARD_NLP_HOST: 0.0.0.0
      TRUTHGUARD_NLP_PORT: 8765
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    restart: unless-stopped
    init: true
    expose:
      - "8765"
    networks:
      - truthguard-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)); raise SystemExit(0 if data.get('ok') and data.get('loaded') else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    <<: *app
    networks:
      - truthguard-internal
      - dokploy-network
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  worker:
    <<: *app
    networks:
      - truthguard-internal
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=300", "--max-time=3600"]
    stop_grace_period: 330s

  scheduler:
    <<: *app
    networks:
      - truthguard-internal
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 330s

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-truthguard}
      MYSQL_USER: ${DB_USERNAME:-truthguard}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    networks:
      truthguard-internal:
        aliases:
          - database
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: database
    expose:
      - "8080"
    networks:
      - truthguard-internal
      - dokploy-network

volumes:
  storage:
  database:

networks:
  truthguard-internal:
    driver: bridge
  dokploy-network:
    external: true
