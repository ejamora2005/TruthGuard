ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/html/storage/app/public>
        AllowOverride None
        <FilesMatch "\.(?i:php|phtml|phar)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    <Files "sw.js">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set Service-Worker-Allowed "/"
    </Files>
    LimitRequestBody 26214400
    Timeout 300
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Keep synchronous CNN/ffmpeg requests from multiplying until the VPS is out
# of memory. With two app replicas this permits up to four concurrent Apache
# requests before the proxy queues new work.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 2
    MaxConnectionsPerChild 500
</IfModule>
